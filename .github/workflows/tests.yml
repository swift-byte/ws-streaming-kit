name: tests

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain info
        run: |
          sw_vers
          swift --version
          python3 --version

      - name: Install test server dependency
        run: python3 -m pip install websockets

      - name: Start test server
        run: |
          nohup python3 ws_test_server.py > server.log 2>&1 &
          sleep 2
          python3 - <<'PY'
          import socket
          for p in (8901, 8902):
              s = socket.socket(); s.settimeout(5)
              s.connect(("127.0.0.1", p)); s.close()
              print(f"port {p} listening")
          PY

      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-output.log

      - name: Logs on failure
        if: failure()
        run: |
          echo "--- server.log ---"
          cat server.log || true
          echo "--- tail test-output.log ---"
          tail -100 test-output.log || true

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test server dependency
        run: python3 -m pip install websockets

      - name: Start test server
        run: |
          nohup python3 ws_test_server.py > server.log 2>&1 &
          sleep 2
          python3 - <<'PY'
          import socket
          for p in (8901, 8902):
              s = socket.socket(); s.settimeout(5)
              s.connect(("127.0.0.1", p)); s.close()
              print(f"port {p} listening")
          PY

      - name: Run tests on iOS Simulator
        run: |
          set -o pipefail
          SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{f=1; next} f && NF {print $1; exit}')
          echo "scheme: $SCHEME"
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            2>&1 | tee ios-test.log | grep -E "Test Suite|Executed|close-code|error:" | tail -60

      - name: Logs on failure
        if: failure()
        run: |
          echo "--- server.log ---"; cat server.log || true
          echo "--- tail ios-test.log ---"; tail -150 ios-test.log || true
